[project]
name = "portfolio-backend"
version = "0.1.0"
description = "Portfolio backend: contact-form API + grounded RAG Q&A demo over Rakesh's portfolio content"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "openai>=1.40",
    "numpy>=2.0",
    "pyyaml>=6.0",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]
tiktoken = [
    "tiktoken>=0.7",
]

[tool.uv]
package = false
